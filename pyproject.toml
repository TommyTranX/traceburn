[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceburn"
version = "0.1.0"
description = "Finds and cuts wasted LLM spend: a local-first waste report for AI agents, plus cost and latency flamegraphs, deterministic replay, and run diffs, all over one SQLite file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tommy Tran", email = "tommy.tranxhec@gmail.com" }]
keywords = ["llm", "agents", "tracing", "observability", "profiling", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TommyTranX/traceburn"
Repository = "https://github.com/TommyTranX/traceburn"
Issues = "https://github.com/TommyTranX/traceburn/issues"

[project.scripts]
traceburn = "traceburn.cli:main"

[project.optional-dependencies]
ui = ["starlette>=0.37", "uvicorn>=0.29"]
all = ["traceburn[ui]"]

[tool.hatch.build.targets.wheel]
packages = ["src/traceburn"]

[tool.hatch.build.targets.wheel.force-include]
"hooks/traceburn_autoinstall.py" = "traceburn_autoinstall.py"
"hooks/traceburn_autoinstall.pth" = "traceburn_autoinstall.pth"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
